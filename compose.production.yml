name: liyaro

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - private
    mem_limit: 512m

  backend:
    build:
      context: .
      target: backend
      args:
        SITE_URL: https://liyaro.ru
        PUBLIC_API_URL: https://liyaro.ru
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      FRONTEND_URL: https://liyaro.ru
      BACKEND_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - private
    mem_limit: 512m
    init: true

  web:
    build:
      context: .
      target: web
      args:
        SITE_URL: https://liyaro.ru
        PUBLIC_API_URL: https://liyaro.ru
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - private
    mem_limit: 256m

networks:
  private:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

